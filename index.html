<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบตรวจเช็คการบ้าน & ตารางเรียน - โรงเรียนสุรศักดิ์มนตรี</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Prompt', sans-serif; background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 30%, #e0c3fc 60%, #8ec5fc 100%); background-attachment: fixed; min-height: 100vh; overflow-x: hidden; }
        .glass-card { background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.12); }
        .glass-sidebar { background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border-right: 1px solid rgba(255, 255, 255, 0.8); }
        .rainbow-text { background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #54a0ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .rainbow-bg { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%); }
    </style>
</head>
<body class="p-3 md:p-6 text-gray-800">

    <div class="max-w-4xl mx-auto space-y-6">
        <div class="glass-card p-4 md:p-5 rounded-3xl text-center">
            <h1 class="text-xl md:text-2xl font-bold rainbow-text flex items-center justify-center gap-2">
                <i class="fa-solid fa-graduation-cap text-indigo-500"></i> ระบบเช็กลิสต์การบ้านออนไลน์ (ม.3/13)
            </h1>
            <p class="text-xs text-gray-600 mt-1">ข้อมูลเชื่อมต่อแบบ Real-time เพื่อนทุกคนเปิดมาเห็นตรงกัน 🚀</p>
        </div>

        <div class="glass-card rounded-3xl p-4 md:p-6 space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-lg font-bold text-gray-800">📝 รายการการบ้านทั้งหมด</h2>
                <button onclick="fetchTodos()" class="text-xs bg-indigo-500 text-white px-3 py-1.5 rounded-xl"><i class="fa-solid fa-rotate"></i> รีเฟรชข้อมูล</button>
            </div>

            <!-- ฟอร์มเพิ่มการบ้าน (ทุกคนพิมพ์ได้ หรือจะจำกัดเฉพาะ Admin ก็ได้ครับ) -->
            <form id="todo-form" class="bg-white/70 p-4 rounded-2xl border border-white space-y-3">
                <div class="text-xs font-bold text-indigo-600">➕ เพิ่มรายการการบ้านใหม่</div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <input type="text" id="todo-subject" placeholder="📌 วิชา (เช่น ค23102)" required class="px-3 py-2 text-xs rounded-xl border border-gray-200 bg-white">
                    <input type="date" id="todo-duedate" required class="px-3 py-2 text-xs rounded-xl border border-gray-200 bg-white">
                    <input type="text" id="todo-task" placeholder="📝 งานที่ต้องทำ" required class="px-3 py-2 text-xs rounded-xl border border-gray-200 bg-white">
                </div>
                <button type="submit" id="submit-btn" class="w-full bg-pink-500 text-white font-medium py-2 rounded-xl text-xs shadow-md hover:bg-pink-600">บันทึกและส่งให้เพื่อนเห็นทันที</button>
            </form>

            <div id="loading" class="text-center text-xs text-gray-500 py-4">กำลังโหลดข้อมูลจากฐานข้อมูล... ⏳</div>
            <ul id="todo-list" class="space-y-2.5"></ul>
        </div>
    </div>

    <script>
        // 👉 นำ URL ของ Web App ที่ได้จาก Google Apps Script มาใส่ตรงนี้ครับ
        const WEB_APP_URL = "ใส่_URL_Google_Apps_Script_ที่นี่";

        document.addEventListener("DOMContentLoaded", fetchTodos);

        async function fetchTodos() {
            if (WEB_APP_URL.includes("ใส่_URL")) {
                document.getElementById('loading').innerHTML = "⚠️ กรุณานำ URL ของ Google Apps Script มาใส่ในโค้ดก่อนครับ!";
                return;
            }
            document.getElementById('loading').style.display = 'block';
            try {
                let res = await fetch(WEB_APP_URL + "?action=getTodos");
                let todos = await res.json();
                renderTodos(todos);
                document.getElementById('loading').style.display = 'none';
            } catch (err) {
                document.getElementById('loading').innerHTML = "❌ เกิดข้อผิดพลาดในการโหลดข้อมูล";
            }
        }

        document.getElementById('todo-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (WEB_APP_URL.includes("ใส่_URL")) { alert('กรุณาใส่ URL ก่อนครับ'); return; }

            const btn = document.getElementById('submit-btn');
            btn.innerText = "กำลังบันทึก...";
            btn.disabled = true;

            const now = new Date();
            const newTodo = {
                action: "addTodo",
                id: Date.now(),
                subject: document.getElementById('todo-subject').value.trim(),
                task: document.getElementById('todo-task').value.trim(),
                dueDate: document.getElementById('todo-duedate').value,
                createdTime: `${now.getDate()}/${now.getMonth()+1}/${now.getFullYear()+543} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`
            };

            await fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(newTodo)
            });

            setTimeout(() => {
                document.getElementById('todo-subject').value = '';
                document.getElementById('todo-task').value = '';
                btn.innerText = "บันทึกและส่งให้เพื่อนเห็นทันที";
                btn.disabled = false;
                fetchTodos();
            }, 1000);
        });

        async function toggleTodo(id) {
            await fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "toggleTodo", id: id })
            });
            setTimeout(fetchTodos, 800);
        }

        async function deleteTodo(id) {
            if(!confirm("ต้องการลบรายการนี้ใช่ไหม?")) return;
            await fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "deleteTodo", id: id })
            });
            setTimeout(fetchTodos, 800);
        }

        function renderTodos(todos) {
            const ul = document.getElementById('todo-list');
            ul.innerHTML = '';
            if (todos.length === 0) {
                ul.innerHTML = '<div class="text-center py-6 text-gray-400 text-xs">🎉 ไม่มีภาระงานการบ้านในขณะนี้!</div>';
                return;
            }
            todos.forEach(t => {
                const li = document.createElement('li');
                li.className = `flex items-center justify-between p-3 rounded-2xl border ${t.completed ? 'bg-gray-100/60 line-through text-gray-400' : 'bg-white/90 border-pink-100 shadow-sm'}`;
                li.innerHTML = `
                    <div class="flex items-start gap-2 flex-1 cursor-pointer" onclick="toggleTodo(${t.id})">
                        <input type="checkbox" ${t.completed ? 'checked' : ''} class="mt-1">
                        <div>
                            <span class="block font-semibold text-xs text-pink-600">${escapeHtml(t.subject)}</span>
                            <span class="text-[10px] text-gray-400">🕒 ${t.createdTime} | 📅 กำหนดส่ง: ${t.dueDate}</span>
                            <p class="text-xs font-medium text-gray-800">${escapeHtml(t.task)}</p>
                        </div>
                    </div>
                    <button onclick="deleteTodo(${t.id})" class="text-red-400 p-1 hover:text-red-600">🗑️</button>
                `;
                ul.appendChild(li);
            });
        }

        function escapeHtml(t) { const d = document.createElement('div'); d.innerText = t || ''; return d.innerHTML; }
    </script>
</body>
</html>
